- name: chunk
  expression: chunk(this.values, 2)
  input: {values: [1, 2, 3]}
  expect: {type: array, out: [[1, 2], [3]]}
  benchmark: [chunk]
- name: zip
  expression: zip(this.left, this.right)
  input: {left: [1, 2], right: ["a", "b"]}
  expect: {type: array, out: [[1, "a"], [2, "b"]]}
  benchmark: [zip]
- name: merge
  expression: merge(this.left, this.right)
  input: {left: {a: 1}, right: {a: 2, b: 3}}
  expect: {type: object, out: {a: 2, b: 3}}
  benchmark: [merge]
- name: union
  expression: union(this.left, this.right)
  input: {left: [1, 2], right: [2, 3]}
  expect: {type: array, out: [1, 2, 3]}
  benchmark: [union]
- name: intersection
  expression: intersection(this.left, this.right)
  input: {left: [1, 2], right: [2, 3]}
  expect: {type: array, out: [2]}
  benchmark: [intersection]
- name: difference
  expression: difference(this.left, this.right)
  input: {left: [1, 2], right: [2, 3]}
  expect: {type: array, out: [1]}
  benchmark: [difference]
- name: lag
  expression: lag(this.values, 1)
  input: {values: [1, 2, 3]}
  expect: {type: array, out: [null, 1, 2]}
  benchmark: [lag]
- name: cumsum
  expression: cumsum(this.values)
  input: {values: [1, 2, 3]}
  expect: {type: array, out: [1, 3, 6]}
  benchmark: [cumsum]
- name: diff
  expression: diff(this.values)
  input: {values: [1, 3, 6]}
  expect: {type: array, out: [2, 3]}
  benchmark: [diff]
