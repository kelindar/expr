- name: now
  expression: now()
  at: "2026-08-30T12:00:00Z"
  expect: {type: time, out: "2026-08-30T12:00:00Z"}
  benchmark: [now]
- name: duration
  expression: duration("5m")
  expect: {type: duration, out: 5m0s}
  benchmark: [duration]
- name: json
  expression: json("value")
  input: {value: 42}
  expect: {type: integer, out: 42}
  benchmark: [json]
- name: raw
  expression: raw(this)
  input: {value: {a: 1}}
  expect: {type: string, out: '{"value":{"a":1}}'}
  benchmark: [raw]
- name: time
  expression: time(0)
  expect: {type: time, out: "1970-01-01T00:00:00Z"}
  benchmark: [time]
