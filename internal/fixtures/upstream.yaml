- name: take
  expression: take([1, 2, 3], 2)
  expect: {type: array, out: [1, 2]}
  benchmark: [take]
- name: keys
  expression: 'sort(keys({a: 1, b: 2}))'
  expect: {type: array, out: [a, b]}
  benchmark: [keys]
- name: values
  expression: 'sort(values({a: 1, b: 2}))'
  expect: {type: array, out: [1, 2]}
  benchmark: [values]
- name: toPairs
  expression: 'len(toPairs({a: 1, b: 2}))'
  expect: {type: integer, out: 2}
  benchmark: [toPairs]
- name: fromPairs
  expression: fromPairs([["a", 1]]).a
  expect: {type: integer, out: 1}
  benchmark: [fromPairs]
- name: reverse
  expression: reverse([1, 2, 3])
  expect: {type: array, out: [3, 2, 1]}
  benchmark: [reverse]
- name: uniq
  expression: uniq([1, 1, 2])
  expect: {type: array, out: [1, 2]}
  benchmark: [uniq]
- name: concat
  expression: concat([1], [2])
  expect: {type: array, out: [1, 2]}
